<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Moved</title>
<script>
(function(){
  var dest = '/kec-crm/' + location.search + location.hash;
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ if (r.scope.indexOf('/knockout-forms/') > -1) r.unregister(); }); }); } catch(e) {}
  try { if (window.caches) caches.keys().then(function(ks){ ks.forEach(function(k){ if (k.indexOf('kf-') === 0) caches.delete(k); }); }); } catch(e) {}
  location.replace(dest);
})();
</script>
<meta http-equiv="refresh" content="1;url=/kec-crm/">
</head><body style="font-family:-apple-system,sans-serif;text-align:center;padding:40px">
<p>This app moved. <a href="/kec-crm/">Open the new one</a>.</p>
</body></html>
