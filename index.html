<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F3EBE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Knockout Forms</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script>/* Home Screen app? set before first paint so the header clears the status bar (core.css html.sa) */
if (navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) document.documentElement.className += ' sa';</script>
<link rel="stylesheet" href="core.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top" class="hdr"></header>
<div id="banner" hidden></div>
<main id="main"></main>
<div class="foot" id="foot" hidden></div>
<nav class="tabs" id="tabs"></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"><span id="toastT"></span><button id="toastU" type="button">Undo</button></div>
<script src="core.js"></script>
<script src="config.js"></script>
<script src="jspdf.umd.min.js"></script>
<script src="pdf.js"></script>

</html>
